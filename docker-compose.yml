services:
  radio-poller:
    build: .
    container_name: radio-poller
    restart: unless-stopped
    # Run as the user that owns the data and backup folders (set APP_UID / APP_GID in .env), so no chown is needed.
    # Create the folders yourself first (mkdir -p data backups): if Docker creates them, root owns them.
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    ports:
      # Set BIND_ADDRESS=127.0.0.1 (in a .env file) when a reverse proxy on this machine sits in front,
      # so the app can only be reached through it.
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-5555}:${PORT:-5555}"   # set PORT in .env to use another port
    environment:
      PORT: "${PORT:-5555}"     # the port the app listens on (and is published on)
      TZ: America/New_York      # timezone used to group plays into days
      POLL_SECONDS: "60"        # how often each station is checked
      BACKUP_DIR: /backups      # where the automatic snapshots go inside the container (the folder below)
      # BACKUP_EVERY_HOURS: "24"  # automatic database snapshots (0 = off)
      # BACKUP_KEEP: "7"          # how many of the newest snapshots to keep
      # BACKUP_COMPRESS: "1"      # gzip the snapshots (0 = save plain .db files)
      # Optional: a Spotify developer app, so the Spotify buttons go straight to the song or artist rather than to a
      # search. Put both values in .env (see .env.example), not here.
      SPOTIFY_CLIENT_ID: "${SPOTIFY_CLIENT_ID:-}"
      SPOTIFY_CLIENT_SECRET: "${SPOTIFY_CLIENT_SECRET:-}"
      # --- for a server that strangers can reach: see "Running on a public server" in the README ---
      # ADMIN_TOKEN: ""         # if set, importing, exporting and changing stations require this token
      # READ_ONLY: "1"          # the web interface can't change anything at all
      # TRUST_FORWARDED_FOR: "1"  # behind ONE reverse proxy: tell clients apart by X-Forwarded-For
      # MAX_CONNECTIONS: "64"   # simultaneous requests before new ones get a 503
      # REQUEST_TIMEOUT: "30"   # seconds a silent client may hold a connection
      # MAX_IMPORT_MB: "1024"   # largest import file accepted
    volumes:
      # Two folders next to this file. Set DATA_PATH / BACKUP_PATH in .env to put them somewhere else.
      - "${DATA_PATH:-./data}:/data"             # the SQLite database
      - "${BACKUP_PATH:-./backups}:/backups"     # automatic snapshots
      - ./config:/config:ro     # stations.json: the starting stations, read on the first run only
    mem_limit: 512m
    cpus: 0.25
    pids_limit: 256
    # The app only writes to /data and /backups, so the rest of the container can be locked down.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
